<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPL Pixel-Prime Interface</title>
<style>
  :root{
    --bg:        #0a0a0a;
    --text:      #ffffff;
    --muted:     #b0b0b0;
    --accent:    #00a8e1; /* Azul Prime Video */
    --font-ui:   'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: #000;
    color: var(--text);
    font-family: var(--font-ui);
    display:flex; flex-direction:column;
    overflow:hidden;
    position: relative;
  }

  /* Fondo dinámico (Imagen _BG.png) */
  .bg-layer {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    z-index: -2;
    transition: background-image 0.4s ease-in-out, opacity 0.4s ease;
    opacity: 0;
    background-color: #111; /* Fondo por si no hay imagen */
  }
  .bg-layer.visible {
    opacity: 1;
  }
  
  .bg-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 45%, rgba(0,0,0,0.2) 100%);
    z-index: -1;
  }

  /* ---------- FILTROS SUPERIORES ---------- */
  .filters {
    display: flex;
    gap: 15px;
    padding: 25px 40px 0 40px;
    z-index: 10;
  }
  .filter-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  /* ---------- LAYOUT PRINCIPAL ---------- */
  main{
    flex:1; display:flex;
    padding: 10px 40px 40px 40px;
    gap: 20px;
    min-height: 0;
    position: relative;
  }

  /* ---------- LISTA DE JUEGOS (IZQUIERDA) ---------- */
  .game-list-container {
    flex: 0 0 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    padding-left: 10px;
  }

  .game-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 70vh;
    overflow-y: auto;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .game-list::-webkit-scrollbar { display: none; }

  .game-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 6px 12px;
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .game-item:hover {
    color: #fff;
    background: rgba(255,255,255,0.05);
  }
  .game-item.selected {
    color: var(--accent);
    background: rgba(0, 168, 225, 0.12);
    font-weight: 600;
  }

  /* Iconos de dispositivo */
  .device-icon {
    font-size: 1.1rem;
    width: 24px;
    text-align: center;
    opacity: 0.6;
    filter: grayscale(100%);
  }
  .game-item.selected .device-icon {
    opacity: 1;
    filter: grayscale(0%);
  }

  /* ---------- INFO / CARÁTULA (DERECHA) ---------- */
  .game-info {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 40px;
  }

  .cover-box {
    width: 260px;
    aspect-ratio: 3/4;
    background: #1a1a1a;
    border-radius: 8px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform 0.3s;
  }
  .cover-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cover-box .placeholder {
    color: #555;
    font-size: 0.9rem;
    text-align: center;
    padding: 10px;
  }
</style>
</head>

    { title: "HP 2 and The Chamber of Secrets", id: "SLES_511.95", device: "USB" }
  ];

  const gameListEl = document.getElementById('gameList');
  const coverBoxEl = document.getElementById('coverBox');
  const bgLayerEl = document.getElementById('bgLayer');
  
  let currentFilter = 'ALL';
  let selectedIndex = 0;
  let filteredGames = [];

  const IMG_PATH = "ART/"; 

  function getCoverUrl(id) { return `${IMG_PATH}${id}_COV.png`; }
  function getBgUrl(id) { return `${IMG_PATH}${id}_BG.png`; }

  function updateList() {
    // Filtrar y ordenar
    filteredGames = rawData
      .filter(g => currentFilter === 'ALL' || g.device === currentFilter)
      .sort((a, b) => a.title.localeCompare(b.title));

    selectedIndex = 0; // Resetear al primer elemento al cambiar filtro
    render();
  }

  function render() {
    if (filteredGames.length === 0) {
      gameListEl.innerHTML = '<div class="game-item">No hay juegos en este dispositivo.</div>';
      coverBoxEl.innerHTML = '<span class="placeholder">Sin juego</span>';
      bgLayerEl.classList.remove('visible');
      return;
    }

    // Renderizar lista
    gameListEl.innerHTML = filteredGames.map((g, i) => {
      const deviceIcon = g.device === 'HDD' ? '💾' : '💿';
      return `
        <div class="game-item ${i === selectedIndex ? 'selected' : ''}" data-index="${i}">
          <span class="device-icon">${deviceIcon}</span>
          <span>${g.title}</span>
        </div>
      `;
    }).join('');

    const game = filteredGames[selectedIndex];
    const coverUrl = getCoverUrl(game.id);
    const bgUrl = getBgUrl(game.id);

    // Actualizar carátula
    coverBoxEl.innerHTML = `
      <img src="${coverUrl}" alt="${game.title}" 
           onerror="this.parentElement.innerHTML='<span class=\\'placeholder\\'>Sin carátula<br>${game.id}</span>'">
    `;

    // Actualizar fondo
    const tempBg = new Image();
    tempBg.src = bgUrl;
    tempBg.onload = () => {
      bgLayerEl.style.backgroundImage = `url('${bgUrl}')`;
      bgLayerEl.classList.add('visible');
    };
    tempBg.onerror = () => {
      // Si no hay fondo (ID_BG.png), usar un gradiente oscuro o la carátula desenfocada
      bgLayerEl.style.backgroundImage = `url('${coverUrl}')`;
      bgLayerEl.classList.add('visible');
    };

    // Listeners de clic
    document.querySelectorAll('.game-item').forEach(el => {
      el.onclick = () => {
        selectedIndex = parseInt(el.dataset.index);
        render();
      };
    });

    // Auto-scroll
    const selectedEl = document.querySelector('.game-item.selected');
    if (selectedEl) {
      selectedEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  // Lógica de los botones de filtro
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      updateList();
    };
  });

  // Navegación con teclado
  document.addEventListener('keydown', (e) => {
    if (filteredGames.length === 0) return;
    
    if (e.key === 'ArrowDown') {
      selectedIndex = Math.min(selectedIndex + 1, filteredGames.length - 1);
      render();
      e.preventDefault();
    }
    if (e.key === 'ArrowUp') {
      selectedIndex = Math.max(selectedIndex - 1, 0);
      render();
      e.preventDefault();
    }
  });

  // Iniciar
  updateList();
</script>
